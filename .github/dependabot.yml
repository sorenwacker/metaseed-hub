version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    open-pull-requests-limit: 5

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # Production container images. Without this the pins are only bumped when
  # someone notices a scanner report, which is how PostgreSQL reached an
  # unpatched minor. The host applies merged bumps weekly via
  # metaseed-containers.timer; see docs/container-updates.md.
  - package-ecosystem: "docker"
    directory: "/ansible/roles/metaseed-hub/files"
    schedule:
      interval: "weekly"
    groups:
      images:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # PostgreSQL and MariaDB cannot open a data directory written by a newer
      # major. An auto-merged major would leave the container exiting at
      # startup and the hub down until a restore, so crossing one stays a
      # planned migration rather than a pull request.
      - dependency-name: "postgres"
        update-types: ["version-update:semver-major"]
      - dependency-name: "mariadb"
        update-types: ["version-update:semver-major"]
