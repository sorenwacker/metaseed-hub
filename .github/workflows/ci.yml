name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run linting
        run: uv run ruff check .

      - name: Run type checking
        run: uv run mypy src/metaseed_hub --ignore-missing-imports

      - name: Run tests
        run: uv run pytest tests/ -v --ignore=tests/test_models.py --ignore=tests/test_multi_spec.py --ignore=tests/test_entity_persistence.py
