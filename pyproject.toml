[project]
name = "metaseed-hub"
dynamic = ["version"]
description = "Collaborative hub for metaseed projects with real-time features"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Sören Wacker" }]
keywords = [
    "metadata",
    "fair-data",
    "research-data-management",
    "miappe",
    "isa-tab",
    "darwin-core",
    "dissco",
    "fairdom-seek",
    "metaseed",
    "fastapi",
    "htmx",
    "mcp",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: FastAPI",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "fastapi>=0.115.0",
    # Security floors for transitive deps pulled in via fastapi (Dependabot):
    # starlette < 1.3.1 and python-multipart < 0.0.31 carry DoS/SSRF advisories.
    "starlette>=1.3.1",
    "python-multipart>=0.0.31",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.30.0",
    "python-keycloak>=4.0.0",
    "websockets>=14.0",
    "redis>=5.0.0",
    "celery[redis]>=5.4.0",
    "alembic>=1.14.0",
    "pydantic-settings>=2.14.2",
    "python-jose[cryptography]>=3.3.0",
    "httpx>=0.28.0",
    "metaseed[dcat,seek]>=0.48.0,<1",
    "mcp>=1.28,<2",
    "types-pyyaml>=6.0.12.20260408",
]

[project.urls]
Homepage = "https://sorenwacker.github.io/metaseed-hub/"
Documentation = "https://sorenwacker.github.io/metaseed-hub/"
Repository = "https://github.com/sorenwacker/metaseed-hub"
Changelog = "https://github.com/sorenwacker/metaseed-hub/blob/main/CHANGELOG.md"
Issues = "https://github.com/sorenwacker/metaseed-hub/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "selenium>=4.20",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "pre-commit>=4.0.0",
    "pylint>=3.3,<4",
    "vulture>=2.13",
    "bandit>=1.8",
]

[tool.bandit]
# Gate on genuine issues. The remaining low-severity hits are false positives:
# B105 flags cookie-name and dev-default constants as "passwords"; B101/B110 are
# intentional asserts and best-effort try/except in known spots. CI runs bandit
# with --severity-level medium, so these do not fail the build.
exclude_dirs = ["tests"]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

# Matches metaseed, which this application is the consumer of: one build
# backend across the two repositories rather than one per scaffold. The version
# still comes from git tags via setuptools-scm, which hatch-vcs wraps, so tag
# handling and .devN numbering are unchanged.
[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/metaseed_hub/_version.py"

# The templates and static assets live under the package and must ship with it;
# hatchling includes the tree it is pointed at.
[tool.hatch.build.targets.wheel]
packages = ["src/metaseed_hub"]

[tool.pytest.ini_options]
markers = [
    "selenium: browser end-to-end tests (needs Chrome + the docker stack + app on :7001)",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
exclude = ["alembic/", "vulture_whitelist.py", "tests/"]

[[tool.mypy.overrides]]
module = ["metaseed.*", "redis.*"]
ignore_missing_imports = true

[dependency-groups]
dev = [
    "mypy>=1.20.2",
    "pytest-asyncio>=1.3.0",
    "types-python-jose>=3.5.0.20260408",
    "types-pyyaml>=6.0.12.20260408",
    "vulture>=2.16",
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.0",
]
