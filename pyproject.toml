[project]
name = "metaseed-hub"
dynamic = ["version"]
description = "Collaborative hub for metaseed projects with real-time features"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    # Security floors for transitive deps pulled in via fastapi (Dependabot):
    # starlette < 1.3.1 and python-multipart < 0.0.31 carry DoS/SSRF advisories.
    "starlette>=1.3.1",
    "python-multipart>=0.0.31",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.30.0",
    "python-keycloak>=4.0.0",
    "websockets>=14.0",
    "redis>=5.0.0",
    "celery[redis]>=5.4.0",
    "alembic>=1.14.0",
    "pydantic-settings>=2.14.2",
    "python-jose[cryptography]>=3.3.0",
    "httpx>=0.28.0",
    "metaseed[dcat,seek]>=0.30.0,<1",
    "mcp>=1.28,<2",
    "types-pyyaml>=6.0.12.20260408",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "selenium>=4.20",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "pre-commit>=4.0.0",
    "pylint>=3.3,<5",
    "vulture>=2.13",
    "bandit>=1.8",
]

[tool.bandit]
# Gate on genuine issues. The remaining low-severity hits are false positives:
# B105 flags cookie-name and dev-default constants as "passwords"; B101/B110 are
# intentional asserts and best-effort try/except in known spots. CI runs bandit
# with --severity-level medium, so these do not fail the build.
exclude_dirs = ["tests"]

[build-system]
requires = ["setuptools>=64", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools_scm]
version_file = "src/metaseed_hub/_version.py"

[tool.pytest.ini_options]
markers = [
    "selenium: browser end-to-end tests (needs Chrome + the docker stack + app on :7001)",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
exclude = ["alembic/", "vulture_whitelist.py", "tests/"]

[[tool.mypy.overrides]]
module = ["metaseed.*", "redis.*"]
ignore_missing_imports = true

[dependency-groups]
dev = [
    "mypy>=1.20.2",
    "pytest-asyncio>=1.3.0",
    "types-python-jose>=3.5.0.20260408",
    "types-pyyaml>=6.0.12.20260408",
    "vulture>=2.16",
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.0",
]
