site_name: Metaseed Hub
site_description: Collaborative metadata management platform
repo_url: https://github.com/sorenwacker/metaseed-hub

theme:
  name: material
  palette:
    primary: teal
    accent: orange
  features:
    - navigation.sections
    - navigation.expand
    - content.code.copy

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Datasets:
    - Overview: datasets/index.md
    - Editing entities: datasets/entities.md
    - Versions and history: datasets/versions.md
    - Importing and exporting: datasets/import-export.md
    - Graph view: datasets/graph.md
  - Collaboration: collaboration.md
  - Spec Builder:
    - Overview: spec-builder/index.md
    - Validation rules: spec-builder/validation-rules.md
    - Publishing and sharing: spec-builder/publishing.md
  - Explorer: explorer.md
  - Connecting an agent (MCP): mcp.md
  - Reference:
    - Supported profiles: reference/profiles.md
    - Ontology lookup: reference/ontology-lookup.md
  - Administration:
    - Overview: administration.md
    - Backups and restore: backups.md
  - Developer:
    - Architecture: developer/architecture.md
    - API Reference: developer/api.md

markdown_extensions:
  - tables
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences
