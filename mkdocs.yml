site_name: Metaseed Hub
site_description: Collaborative metadata management platform
repo_url: https://github.com/sorenwacker/metaseed-hub
repo_name: sorenwacker/metaseed-hub
edit_uri: edit/main/docs/

# Rendered in the footer of every page. AI-generated content must be disclosed
# as such (EU AI Act transparency); tests/test_docs_ai_disclosure.py gates this
# line.
copyright: This documentation was generated with Claude Code (AI-generated content).

theme:
  name: material
  logo: images/metaseed-icon.svg
  favicon: images/metaseed-icon.svg
  # The typefaces are served from this site, so Google's copies are not
  # fetched: no third party sees a reader, and the docs match the application.
  font: false
  palette:
    # `custom`, not a named colour: a named palette sets the colour variables on
    # `[data-md-color-primary=...]`, which outranks the `:root` override in
    # stylesheets/metaseed.css and kept these docs teal.
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    # Matching metaseed's: the tab bar is how a reader moves between the top
    # level sections, and one site having it while the other does not made the
    # two look like different products.
    # No tab bar: the hub has eleven top level sections and the bar cannot
    # show them at any ordinary width -- the last entry simply vanished.
    # The sidebar is vertical and scrolls, so nothing is hidden.
    - navigation.sections
    - content.code.copy
    # `edit_uri` alone renders nothing; this is what puts the pencil on a page.
    - content.action.edit

extra_css:
  - stylesheets/metaseed.css

nav:
  - Home: index.md
  # The library this is built on. Second, not last: with eleven tabs the
  # bar overflows and the final entry is the one that disappears.
  - Metaseed: https://sorenwacker.github.io/metaseed/
  - Getting Started: getting-started.md
  - Datasets:
    - Overview: datasets/index.md
    - Editing entities: datasets/entities.md
    - Versions and history: datasets/versions.md
    - Importing and exporting: datasets/import-export.md
    - Graph view: datasets/graph.md
  - Collaboration: collaboration.md
  - Spec Builder:
    - Overview: spec-builder/index.md
    - Validation rules: spec-builder/validation-rules.md
    - Publishing and sharing: spec-builder/publishing.md
  - Explorer: explorer.md
  - Connecting an agent (MCP): mcp.md
  - MCP FAQ: mcp-faq.md
  - Reference:
    - Supported profiles: reference/profiles.md
    - Ontology lookup: reference/ontology-lookup.md
  - Administration:
    - Overview: administration.md
    - Backups and restore: backups.md
    - Container updates: container-updates.md
  - Developer:
    - Architecture: developer/architecture.md
    - API Reference: developer/api.md

markdown_extensions:
  - tables
  - admonition
  # Both are needed for markup metaseed's docs already use -- an image with a
  # width, a figure, a card grid. Without them that markup passes through as
  # literal text, which is what happened when a block was copied across.
  - attr_list
  - md_in_html
  - pymdownx.highlight
  - pymdownx.superfences
