{% extends "base.html" %}

{% block title %}Login - Metaseed Hub{% endblock %}

{% block content %}
<div class="login-container">
    <div class="login-card">
        <img src="/hub/hub-static/images/metaseed-logo.svg" alt="Metaseed" class="login-logo">
        <p>Collaborative metadata management for scientific research.</p>
        <a href="/hub/auth/login" class="btn btn-primary btn-lg">
            Sign in
        </a>
        <p class="version-info">v{{ version_info.version }}</p>
    </div>
</div>
{% endblock %}
