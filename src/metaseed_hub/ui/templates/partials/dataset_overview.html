<!-- Overview Panel with Tabs -->
<div class="dataset-overview">
    <div class="overview-header">
        <p class="overview-hint">Select an entity from the sidebar to edit{% if not tree_data %}, or create one using the buttons above{% endif %}.</p>
    </div>

    <!-- Tab Navigation -->
    <div class="overview-tabs">
        <button class="overview-tab active" data-tab="history" onclick="switchOverviewTab('history')">
            History
        </button>
        <button class="overview-tab" data-tab="comments" onclick="switchOverviewTab('comments')">
            Comments
        </button>
        <button class="overview-tab" data-tab="sharing" onclick="switchOverviewTab('sharing')">
            Sharing
            <span class="tab-count">{{ members|length }}</span>
        </button>
    </div>

    <!-- History Tab -->
    <div class="overview-tab-content active" id="tab-history">
        <div id="versions-list"
             hx-get="/hub/datasets/{{ dataset.id }}/versions"
             hx-trigger="load"
             hx-swap="innerHTML">
            Loading version history...
        </div>
    </div>

    <!-- Comments Tab -->
    <div class="overview-tab-content" id="tab-comments">
        <div id="comments-list"
             hx-get="/hub/datasets/{{ dataset.id }}/comments"
             hx-trigger="revealed"
             hx-swap="innerHTML">
            Loading comments...
        </div>
        <form class="comment-add-form"
              hx-post="/hub/datasets/{{ dataset.id }}/comments"
              hx-target="#comments-list"
              hx-swap="innerHTML"
              hx-on:htmx:after-request="this.reset()">
            <textarea name="content" placeholder="Add a comment..." class="form-input" rows="2" required></textarea>
            <button type="submit" class="btn btn-primary">Post</button>
        </form>
    </div>

    <!-- Sharing Tab -->
    <div class="overview-tab-content" id="tab-sharing">
        {# One panel for every shared thing: partials/members_panel.html #}
        <div id="members-panel"
             hx-get="/hub/sharing/dataset/{{ dataset.id }}/members"
             hx-trigger="load" hx-swap="innerHTML">
        </div>
    </div>
</div>

<script>
function switchOverviewTab(tabName) {
    document.querySelectorAll('.overview-tab').forEach(tab => {
        tab.classList.toggle('active', tab.dataset.tab === tabName);
    });
    document.querySelectorAll('.overview-tab-content').forEach(content => {
        content.classList.toggle('active', content.id === 'tab-' + tabName);
    });
}
</script>
