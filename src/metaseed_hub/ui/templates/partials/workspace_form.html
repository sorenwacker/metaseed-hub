<div class="modal-overlay" onclick="this.parentElement.innerHTML=''">
    <div class="modal-content" onclick="event.stopPropagation()">
        <h2>{% if workspace %}Edit Workspace{% else %}New Workspace{% endif %}</h2>
        <form method="post"
              {% if workspace %}
              action="/hub/workspaces/{{ workspace.id }}"
              hx-put="/hub/workspaces/{{ workspace.id }}"
              hx-swap="none"
              {% else %}
              action="/hub/workspaces"
              {% endif %}>
            {% if csrf_token %}
            <input type="hidden" name="_csrf_token" value="{{ csrf_token }}">
            {% endif %}
            <div class="form-group">
                <label for="name">Name</label>
                <input type="text" id="name" name="name" required
                       placeholder="My Workspace" autofocus
                       value="{{ workspace.name if workspace else '' }}">
            </div>
            <div class="form-group">
                <label for="description">Description (optional)</label>
                <textarea id="description" name="description" rows="3"
                          placeholder="What is this workspace for?">{{ workspace.description if workspace and workspace.description else '' }}</textarea>
            </div>
            <div class="form-actions">
                <button type="button" class="btn"
                        onclick="this.closest('.modal-overlay').parentElement.innerHTML=''">
                    Cancel
                </button>
                <button type="submit" class="btn btn-primary">
                    {% if workspace %}Save Changes{% else %}Create Workspace{% endif %}
                </button>
            </div>
        </form>
    </div>
</div>
