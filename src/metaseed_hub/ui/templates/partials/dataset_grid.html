<div class="dataset-grid" id="dataset-grid">
    {% for dataset in datasets %}
    <div class="dataset-card">
        <a href="/hub/datasets/{{ dataset.id }}" class="dataset-card-link">
            <h3>{{ dataset.name }}</h3>
            <div class="dataset-meta">
                <span class="profile-badge">{{ dataset.profile }} {{ dataset.version }}</span>
                <span class="date">{{ dataset.updated_at.strftime('%Y-%m-%d %H:%M') }}</span>
            </div>
        </a>
        <button class="dataset-delete" title="Delete dataset"
                hx-delete="/hub/datasets/{{ dataset.id }}"
                hx-target="#dataset-grid"
                hx-swap="outerHTML"
                hx-confirm="Delete '{{ dataset.name }}'? This cannot be undone.">
            &times;
        </button>
    </div>
    {% else %}
    <div class="empty-state-card">
        <div class="empty-state-icon">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <path d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"/>
            </svg>
        </div>
        <p class="empty-state-title">No datasets yet</p>
        <p class="empty-state-desc">Create a dataset to start working with metadata.</p>
        <a href="/hub/datasets/new" class="btn btn-primary">+ New Dataset</a>
    </div>
    {% endfor %}
</div>
