<div class="modal-overlay" onclick="this.parentElement.innerHTML=''">
    <div class="modal-content" onclick="event.stopPropagation()">
        <h2>New Project</h2>
        <form method="post" action="/hub/projects">
            <input type="hidden" name="workspace_id" value="{{ workspace_id }}">
            <div class="form-group">
                <label for="name">Name</label>
                <input type="text" id="name" name="name" required
                       placeholder="My Project" autofocus>
            </div>
            <div class="form-group">
                <label for="profile">Profile</label>
                <select id="profile" name="profile" required onchange="updateVersions()">
                    <option value="">Select a profile...</option>
                    {% for profile in profiles %}
                    <option value="{{ profile.name }}" data-versions="{{ profile.versions | join(',') }}">
                        {{ profile.name }}
                    </option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label for="version">Version</label>
                <select id="version" name="version" required>
                    <option value="">Select profile first...</option>
                </select>
            </div>
            <div class="form-actions">
                <button type="button" class="btn"
                        onclick="this.closest('.modal-overlay').parentElement.innerHTML=''">
                    Cancel
                </button>
                <button type="submit" class="btn btn-primary">Create Project</button>
            </div>
        </form>
    </div>
</div>
<script>
function updateVersions() {
    const profileSelect = document.getElementById('profile');
    const versionSelect = document.getElementById('version');
    const selectedOption = profileSelect.options[profileSelect.selectedIndex];
    const versions = selectedOption.dataset.versions;

    versionSelect.innerHTML = '';

    if (versions) {
        const versionList = versions.split(',');
        versionList.forEach(v => {
            const opt = document.createElement('option');
            opt.value = v;
            opt.textContent = v;
            versionSelect.appendChild(opt);
        });
    } else {
        const opt = document.createElement('option');
        opt.value = '';
        opt.textContent = 'Select profile first...';
        versionSelect.appendChild(opt);
    }
}
</script>
