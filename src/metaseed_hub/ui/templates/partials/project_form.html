<div class="modal-overlay" onclick="this.parentElement.innerHTML=''">
    <div class="modal-content modal-large" onclick="event.stopPropagation()">
        <h2 class="modal-title">New Project</h2>
        <p class="modal-subtitle">Choose a metadata standard and version for your project.</p>

        <div class="project-name-field">
            {% if csrf_token %}
            <input type="hidden" id="csrf-token" value="{{ csrf_token }}">
            {% endif %}
            <input type="hidden" id="workspace-id" value="{{ workspace_id | e }}">
            <label for="project-name">Project Name</label>
            <input type="text" id="project-name" name="name" required
                   placeholder="My Project" autofocus>
        </div>

        <div class="profile-grid">
            {% for profile in profiles %}
            <div class="profile-card">
                <div class="profile-card-accent"></div>
                <h3>{{ profile.display_name }}</h3>
                {% if profile.description %}
                <p>{{ profile.description }}</p>
                {% endif %}
                <div class="profile-actions">
                    {% for version in profile.versions %}
                    <div class="version-row">
                        <button type="button"
                                class="btn {% if version == profile.latest_version %}btn-primary{% else %}btn-secondary{% endif %}"
                                onclick="createProject('{{ profile.name }}', '{{ version }}')">
                            v{{ version }}{% if version == profile.latest_version %} (latest){% endif %}
                        </button>
                        <button type="button"
                                class="btn btn-outline-accent"
                                onclick="createProjectWithExample('{{ profile.name }}', '{{ version }}')"
                                title="Create with example data">
                            Load Example
                        </button>
                    </div>
                    {% endfor %}
                </div>
            </div>
            {% endfor %}
        </div>

        <div class="modal-footer">
            <button type="button" class="btn btn-secondary"
                    onclick="this.closest('.modal-overlay').parentElement.innerHTML=''">
                Cancel
            </button>
        </div>
    </div>
</div>

<script>
async function createProject(profile, version) {
    const name = document.getElementById('project-name').value;
    if (!name) {
        alert('Please enter a project name');
        document.getElementById('project-name').focus();
        return;
    }

    const csrfToken = document.getElementById('csrf-token')?.value || '';
    const workspaceId = document.getElementById('workspace-id')?.value || '';

    if (!workspaceId) {
        alert('Error: workspace ID not found');
        return;
    }

    const formData = new FormData();
    formData.append('workspace_id', workspaceId);
    formData.append('name', name);
    formData.append('profile', profile);
    formData.append('version', version);
    formData.append('_csrf_token', csrfToken);

    try {
        const response = await fetch('/hub/projects', {
            method: 'POST',
            body: formData
        });

        if (response.redirected) {
            window.location.href = response.url;
        } else if (response.ok) {
            if (response.url.includes('/projects/')) {
                window.location.href = response.url;
            } else {
                window.location.reload();
            }
        } else {
            const text = await response.text();
            alert('Error creating project: ' + text.substring(0, 200));
        }
    } catch (error) {
        alert('Network error: ' + error.message);
    }
}

async function createProjectWithExample(profile, version) {
    const name = document.getElementById('project-name').value || `${profile} Example`;
    document.getElementById('project-name').value = name;

    const csrfToken = document.getElementById('csrf-token')?.value || '';
    const workspaceId = document.getElementById('workspace-id')?.value || '';

    if (!workspaceId) {
        alert('Error: workspace ID not found');
        return;
    }

    const formData = new FormData();
    formData.append('workspace_id', workspaceId);
    formData.append('name', name);
    formData.append('profile', profile);
    formData.append('version', version);
    formData.append('_csrf_token', csrfToken);
    formData.append('load_example', 'true');

    try {
        const response = await fetch('/hub/projects', {
            method: 'POST',
            body: formData
        });

        if (response.redirected) {
            window.location.href = response.url;
        } else if (response.ok) {
            // For 303 redirects, fetch follows automatically
            // Check if we got the project URL in response
            if (response.url.includes('/projects/')) {
                window.location.href = response.url;
            } else {
                window.location.reload();
            }
        } else {
            const text = await response.text();
            alert('Error creating project: ' + text.substring(0, 200));
        }
    } catch (error) {
        alert('Network error: ' + error.message);
    }
}
</script>

<style>

}

}

    font-weight: 500;

    width: 100%;

    border-radius: var(--radius-md);
    font-size: 1rem;
}

    outline: none;
    border-color: var(--clr-moss);
    box-shadow: 0 0 0 3px rgba(74, 124, 89, 0.1);
}

.profile-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: var(--space-lg);
    margin-bottom: var(--space-xl);
}

}

    font-family: var(--font-display, Georgia, serif);
    font-size: 1.25rem;
    font-weight: 500;
    color: var(--clr-moss);

}

.profile-card p {
    font-size: 0.875rem;
    color: var(--clr-ink-light);
    margin: 0 0 var(--space-md) 0;

}

.profile-actions {
    display: flex;
    flex-direction: column;
    gap: var(--space-sm);
}

.version-row {
    display: flex;
    gap: var(--space-sm);

}

.version-row .btn {

}

.btn-outline-accent {
    background: transparent;

}

    background: var(--clr-accent, #c17f59);

}

.modal-footer {
    display: flex;
    justify-content: flex-end;
    padding-top: var(--space-md);
    border-top: 1px solid var(--clr-fog);
}
</style>
