{% if tree_data %}
<ul class="entity-tree">
    {% for item in tree_data %}
    <li class="entity-item">
        <span class="entity-type-badge">{{ item.type }}</span>
        <a href="#" class="entity-name"
           hx-get="/hub/datasets/{{ dataset_id }}/entity/{{ item.id }}"
           hx-target="#editor">{{ item.label or item.name or "Unnamed" }}</a>
        <button class="entity-delete" title="Delete"
                hx-delete="/hub/datasets/{{ dataset_id }}/entity/{{ item.id }}"
                hx-target="#entity-tree"
                hx-confirm="Delete this {{ item.type }}?">x</button>
    </li>
    {% endfor %}
</ul>
{% else %}
<div class="empty-state"><p>No entities yet.</p></div>
{% endif %}

<div id="editor" hx-swap-oob="innerHTML">
    <div class="editor-placeholder">
        <p>Select an entity or create a new one.</p>
    </div>
</div>
