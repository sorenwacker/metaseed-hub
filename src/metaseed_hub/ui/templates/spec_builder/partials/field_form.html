<div class="field-edit-form">
    <form hx-put="/hub/spec-builder/{{ draft_id }}/entity/{{ entity_name }}/field/{{ field_idx }}"
          hx-target="#editor-content"
          hx-swap="innerHTML">

        <div class="form-row-3">
            <div class="form-group">
                <label class="form-label">Name</label>
                <input type="text"
                       name="name"
                       class="form-input"
                       value="{{ field.name }}"
                       required
                       pattern="[a-z_][a-z0-9_]*">
            </div>
            <div class="form-group">
                <label class="form-label">Type</label>
                <select name="field_type" class="form-input">
                    {% for ft in field_types %}
                    <option value="{{ ft }}" {% if field.type == ft %}selected{% endif %}>{{ ft }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group form-group-checkbox">
                <label class="form-checkbox">
                    <input type="checkbox"
                           name="required"
                           value="true"
                           {% if field.required %}checked{% endif %}>
                    Required
                </label>
            </div>
        </div>

        <details class="field-optional">
            <summary>Optional Fields</summary>
            <div class="field-optional-content">
                <div class="form-row-2">
                    <div class="form-group">
                        <label class="form-label">Description</label>
                        <textarea name="description"
                                  class="form-input"
                                  rows="1">{{ field.description or '' }}</textarea>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Codename</label>
                        <input type="text"
                               name="codename"
                               class="form-input"
                               value="{{ field.codename or '' }}"
                               placeholder="camelCase">
                    </div>
                </div>
                <div class="form-row-2">
                    <div class="form-group">
                        <label class="form-label">Ontology Term</label>
                        <input type="text"
                               name="ontology_term"
                               class="form-input"
                               value="{{ field.ontology_term or '' }}"
                               placeholder="Search ontology terms..."
                               data-ontology-autocomplete>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Ontologies</label>
                        <input type="text"
                               name="ontologies"
                               class="form-input"
                               value="{{ field.ontologies | join(', ') if field.ontologies else '' }}"
                               placeholder="po, pato, ncbitaxon">
                        <small class="form-help">OLS IDs to search (comma-separated)</small>
                    </div>
                </div>
                <div class="form-row-2">
                    <div class="form-group">
                        <label class="form-label">Unique Within</label>
                        <select name="unique_within" class="form-input">
                            <option value="">Not unique</option>
                            <option value="parent" {% if field.unique_within == 'parent' %}selected{% endif %}>Parent entity</option>
                            <option value="global" {% if field.unique_within == 'global' %}selected{% endif %}>Globally</option>
                        </select>
                    </div>
                    <div class="form-group"></div>
                </div>
            </div>
        </details>

        <div class="form-group related-entity-group">
            <label class="form-label">Related Entity</label>
            <input type="text"
                   name="items"
                   class="form-input"
                   value="{{ field.items or '' }}"
                   placeholder="Select target entity for list/entity types"
                   list="entity-list">
            <datalist id="entity-list">
                {% for ename in spec.entities.keys() %}
                <option value="{{ ename }}">
                {% endfor %}
            </datalist>
        </div>

        <details class="field-advanced">
            <summary>Constraints</summary>
            <div class="field-advanced-content">
                <div class="form-row-2">
                    <div class="form-group">
                        <label class="form-label">Parent Ref</label>
                        <input type="text"
                               name="parent_ref"
                               class="form-input"
                               value="{{ field.parent_ref or '' }}"
                               placeholder="Entity.field">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Reference</label>
                        <input type="text"
                               name="reference"
                               class="form-input"
                               value="{{ field.reference or '' }}"
                               placeholder="Entity.field">
                    </div>
                </div>

                <div class="form-row-3">
                    <div class="form-group">
                        <label class="form-label">Pattern</label>
                        <input type="text"
                               name="pattern"
                               class="form-input"
                               value="{{ field.constraints.pattern if field.constraints else '' }}">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Min</label>
                        <input type="number"
                               name="minimum"
                               class="form-input"
                               step="any"
                               value="{{ field.constraints.minimum if field.constraints and field.constraints.minimum is not none else '' }}">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Max</label>
                        <input type="number"
                               name="maximum"
                               class="form-input"
                               step="any"
                               value="{{ field.constraints.maximum if field.constraints and field.constraints.maximum is not none else '' }}">
                    </div>
                </div>

                <div class="form-row-2">
                    <div class="form-group">
                        <label class="form-label">Min Length</label>
                        <input type="number"
                               name="min_length"
                               class="form-input"
                               min="0"
                               value="{{ field.constraints.min_length if field.constraints and field.constraints.min_length else '' }}">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Max Length</label>
                        <input type="number"
                               name="max_length"
                               class="form-input"
                               min="0"
                               value="{{ field.constraints.max_length if field.constraints and field.constraints.max_length else '' }}">
                    </div>
                </div>

                <div class="form-row-2">
                    <div class="form-group">
                        <label class="form-label">Min Items</label>
                        <input type="number"
                               name="min_items"
                               class="form-input"
                               min="0"
                               value="{{ field.constraints.min_items if field.constraints and field.constraints.min_items else '' }}">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Max Items</label>
                        <input type="number"
                               name="max_items"
                               class="form-input"
                               min="0"
                               value="{{ field.constraints.max_items if field.constraints and field.constraints.max_items else '' }}">
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">Allowed Values (one per line)</label>
                    <textarea name="enum_values"
                              class="form-input"
                              rows="2"
                              placeholder="value1&#10;value2&#10;value3">{% if field.constraints and field.constraints.enum %}{{ field.constraints.enum|join('\n') }}{% endif %}</textarea>
                </div>
            </div>
        </details>

        <details class="field-optional">
            <summary>Markers</summary>
            <div class="field-optional-content">
                <div class="form-group form-group-checkbox">
                    <label class="form-checkbox">
                        <input type="checkbox" name="owns" {% if field.owns %}checked{% endif %}>
                        Owns (this list/entity field contains the nested entity)
                    </label>
                </div>
                <div class="form-group form-group-checkbox">
                    <label class="form-checkbox">
                        <input type="checkbox" name="is_identifier" {% if field.is_identifier %}checked{% endif %}>
                        Identifier
                    </label>
                </div>
                <div class="form-group form-group-checkbox">
                    <label class="form-checkbox">
                        <input type="checkbox" name="is_label" {% if field.is_label %}checked{% endif %}>
                        Label field
                    </label>
                </div>
                <div class="form-row-2">
                    <div class="form-group">
                        <label class="form-label">Tier</label>
                        <select name="tier" class="form-input">
                            <option value="" {% if not field.tier %}selected{% endif %}>&mdash;</option>
                            <option value="required" {% if field.tier == 'required' %}selected{% endif %}>required</option>
                            <option value="recommended" {% if field.tier == 'recommended' %}selected{% endif %}>recommended</option>
                            <option value="optional" {% if field.tier == 'optional' %}selected{% endif %}>optional</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Unit</label>
                        <input type="text" name="unit" class="form-input" value="{{ field.unit or '' }}">
                    </div>
                </div>
                <div class="form-row-2">
                    <div class="form-group">
                        <label class="form-label">Label</label>
                        <input type="text" name="label" class="form-input" value="{{ field.label or '' }}">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Example</label>
                        <input type="text" name="example" class="form-input" value="{{ field.example or '' }}">
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label">Options (comma-separated)</label>
                    <input type="text" name="options" class="form-input"
                           value="{% if field.options %}{{ field.options|join(', ') }}{% endif %}">
                </div>
            </div>
        </details>

        <div class="field-form-actions">
            <button type="button"
                    class="btn btn-sm"
                    hx-get="/hub/spec-builder/{{ draft_id }}/entity/{{ entity_name }}"
                    hx-target="#editor-content"
                    hx-swap="innerHTML">
                Cancel
            </button>
            <button type="submit" class="btn btn-primary btn-sm">Save Field</button>
        </div>
    </form>
</div>
