{% if error %}
<div class="alert alert-error">{{ error }}</div>
{% endif %}

<div class="entities-list">
    {% for name, entity in entities.items() %}
    <div class="entity-list-item {% if name == editing_entity %}active{% endif %}"
         hx-get="/hub/spec-builder/entity/{{ name }}"
         hx-target="#editor-content"
         hx-swap="innerHTML"
         onclick="document.getElementById('editor-panel').classList.add('open')">
        <div class="entity-info">
            <span class="entity-name">
                {{ name }}
                {% if name == root_entity %}
                <span class="root-badge">ROOT</span>
                {% endif %}
            </span>
            <span class="entity-field-count">{{ entity.fields|length }} fields</span>
        </div>
    </div>
    {% else %}
    <div class="empty-state-sm">
        <p>No entities yet</p>
    </div>
    {% endfor %}
</div>
