{% extends "base.html" %}

{% block title %}Chat - {{ dataset.name }} - Metaseed Hub{% endblock %}

{% block nav %}
<a href="/hub/" class="nav-item">Workspaces</a>
<span class="nav-sep">/</span>
<a href="/hub/workspaces/{{ dataset.workspace_id }}" class="nav-item">Workspace</a>
<span class="nav-sep">/</span>
<a href="/hub/datasets/{{ dataset.id }}" class="nav-item">{{ dataset.name }}</a>
<span class="nav-sep">/</span>
<span class="nav-item active">Chat</span>
{% endblock %}

{% block content %}
<div class="chat-page">
    <div class="chat-header">
        <h2>{{ dataset.name }} - Team Chat</h2>
    </div>
    <div id="chat-messages" class="chat-messages">
        <p class="chat-placeholder">Chat messages will appear here...</p>
    </div>
    <form class="chat-form"
          hx-post="/hub/datasets/{{ dataset.id }}/chat"
          hx-target="#chat-messages"
          hx-swap="beforeend">
        <input type="text" name="message" placeholder="Type a message..."
               autocomplete="off">
        <button type="submit" class="btn btn-primary">Send</button>
    </form>
</div>
{% endblock %}
