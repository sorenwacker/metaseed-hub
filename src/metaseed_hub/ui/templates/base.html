<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Metaseed Hub{% endblock %}</title>
    <link rel="icon" href="/hub/hub-static/images/metaseed-icon.svg" type="image/svg+xml">
    <script src="https://unpkg.com/htmx.org@1.9.12/dist/htmx.min.js"
            integrity="sha384-ujb1lZYygJmzgSwoxRggbCHcjc0rB2XoQrxeTUQyRjrOnlCoYta87iKBWq3EsdM2"
            crossorigin="anonymous"></script>
    <link rel="stylesheet" href="/hub/hub-static/css/hub.css">
    {% if csrf_token %}<meta name="csrf-token" content="{{ csrf_token }}">{% endif %}
    {% block head %}{% endblock %}
</head>
<body hx-headers='{"X-Requested-With": "XMLHttpRequest"{% if csrf_token %}, "X-CSRF-Token": "{{ csrf_token }}"{% endif %}}'>
    <div class="hub-layout">
        <header class="hub-header">
            <a href="/hub/" class="hub-logo">
                <img src="/hub/hub-static/images/metaseed-icon.svg" alt="" class="hub-logo-icon">
                <span>Metaseed Hub</span>
            </a>
            <nav class="hub-nav">
                {% block nav %}{% endblock %}
            </nav>
            <div class="hub-user">
                {% if user %}
                <span class="hub-user-name">{{ user.name }}</span>
                <a href="/hub/auth/logout" class="btn btn-sm">Logout</a>
                {% else %}
                <a href="/hub/auth/login" class="btn btn-primary btn-sm">Login</a>
                {% endif %}
            </div>
        </header>

        <main class="hub-main">
            {% block content %}{% endblock %}
        </main>
    </div>

    <div id="notification-container" class="notification-container"></div>

    <footer class="hub-footer">
        <span class="version-info" title="Branch: {{ version_info.branch if version_info else 'unknown' }}">
            {{ version_info.short_commit if version_info else 'dev' }}
        </span>
    </footer>

    <script src="/hub/hub-static/js/hub.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
