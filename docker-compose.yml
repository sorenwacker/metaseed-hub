services:
  postgres:
    image: postgres:16
    container_name: metaseed-hub-postgres
    environment:
      POSTGRES_USER: metaseed
      POSTGRES_PASSWORD: metaseed_dev
      POSTGRES_DB: metaseed_hub
    ports:
      - "7432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metaseed -d metaseed_hub"]
      interval: 5s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: metaseed-hub-keycloak
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/metaseed_hub
      KC_DB_USERNAME: metaseed
      KC_DB_PASSWORD: metaseed_dev
    ports:
      - "7080:8080"
    volumes:
      - ./keycloak/metaseed-realm.json:/opt/keycloak/data/import/metaseed-realm.json:ro
    depends_on:
      postgres:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    container_name: metaseed-hub-redis
    ports:
      - "7379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
