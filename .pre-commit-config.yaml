repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.13
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run mypy --ignore-missing-imports --strict
        language: system
        types: [python]
        exclude: ^(alembic/|tests/|vulture_whitelist\.py|scripts/)

  - repo: local
    hooks:
      - id: vulture
        name: vulture
        entry: uv run vulture
        args: [src/, vulture_whitelist.py, --min-confidence=80]
        language: system
        types: [python]
        pass_filenames: false

  - repo: local
    hooks:
      - id: duplicate-code
        name: duplicate code (single source of truth)
        entry: uv run pylint --disable=all --enable=duplicate-code --min-similarity-lines=8 -j 4 src/metaseed_hub
        language: system
        stages: [pre-push]
        pass_filenames: false
        always_run: true
      - id: bandit
        name: bandit
        entry: uv run bandit
        args: [-r, src/metaseed_hub, --severity-level, medium, -q]
        language: system
        types: [python]
        pass_filenames: false
