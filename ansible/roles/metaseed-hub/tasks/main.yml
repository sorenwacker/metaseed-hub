---
- name: Create app user
  ansible.builtin.user:
    name: "{{ app_user }}"
    group: "{{ app_group }}"
    home: "{{ app_dir }}"
    shell: /bin/bash
    system: true
  tags: setup

- name: Create app directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    mode: "0755"
  loop:
    - "{{ app_dir }}"
    - "{{ app_dir }}/logs"
  tags: setup

- name: Install system dependencies
  ansible.builtin.apt:
    name:
      - git
      - curl
      - postgresql-client
      - docker.io
      # Compose v2. v1 (1.29.2) cannot recreate a container against the
      # installed engine -- it stops the old one, fails with KeyError
      # 'ContainerConfig', and leaves the service down.
      - docker-compose-plugin
    state: present
    update_cache: true
  tags: setup

- name: Start Docker service
  ansible.builtin.systemd:
    name: docker
    enabled: true
    state: started
  tags: setup

- name: Add app user to docker group
  ansible.builtin.user:
    name: "{{ app_user }}"
    groups: docker
    append: true
  tags: setup

- name: Create docker directory
  ansible.builtin.file:
    path: /opt/metaseed-docker
    state: directory
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    mode: "0755"
  tags: setup

# Copied verbatim, not templated: Dependabot reads `docker-compose.yml` and not
# `.j2`, so keeping the pins in a plain file is what makes them get bumped at
# all. Credentials come from the .env below instead.
- name: Install docker-compose file
  ansible.builtin.copy:
    src: docker-compose.yml
    dest: /opt/metaseed-docker/docker-compose.yml
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    mode: "0644"
  tags:
    - setup
    - matomo
    - containers

- name: Create docker-compose environment file
  ansible.builtin.template:
    src: docker-env.j2
    dest: /opt/metaseed-docker/.env
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    mode: "0600"
  tags:
    - setup
    - matomo
    - containers

# Written before the compose file is brought up, because the container mounts
# it: a missing source would have Docker create a directory in its place.
- name: Let Matomo see the visitor rather than the proxy
  ansible.builtin.template:
    src: matomo-common.config.ini.php.j2
    dest: /opt/metaseed-docker/matomo-common.config.ini.php
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    mode: "0644"
  tags:
    - setup
    - matomo

# Its own tag so the analytics configuration can be applied without the rest of
# the role, whose "Pull latest changes" would move the checkout to the tip of
# main -- releases here are tag-driven, and a config fix must not deploy code.
#
# Copied into the volume rather than bind-mounted from the compose file: a new
# mount needs the container recreated, and docker-compose 1.29.2 on this host
# cannot recreate against the installed Docker Engine (KeyError 'ContainerConfig'
# reading image_config). It stops the old container first, so an attempted
# recreate takes Matomo down and leaves it down. The volume persists across
# rebuilds, so the file survives there anyway.
- name: Give Matomo its proxy configuration
  ansible.builtin.shell: |
    set -e
    docker cp /opt/metaseed-docker/matomo-common.config.ini.php \
      metaseed-matomo:/var/www/html/config/common.config.ini.php
    docker exec metaseed-matomo \
      chown www-data:www-data /var/www/html/config/common.config.ini.php
    docker restart metaseed-matomo
  changed_when: true
  tags:
    - never
    - matomo

- name: Start database services
  become_user: "{{ app_user }}"
  ansible.builtin.shell: |
    docker compose up -d
  args:
    chdir: /opt/metaseed-docker
  tags: setup

- name: Wait for PostgreSQL
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: 5432
    delay: 5
    timeout: 60
  tags: setup

- name: Install uv
  become_user: "{{ app_user }}"
  ansible.builtin.shell: |
    curl -LsSf https://astral.sh/uv/install.sh | sh
  args:
    creates: "{{ app_dir }}/.local/bin/uv"
  tags: setup

- name: Check if repo exists
  ansible.builtin.stat:
    path: "{{ app_dir }}/.git"
  register: git_dir
  tags: setup

- name: Clone repository
  become_user: "{{ app_user }}"
  ansible.builtin.git:
    repo: "{{ repo_url }}"
    dest: "{{ app_dir }}"
    version: "{{ repo_branch }}"
    force: false
  register: git_result
  when: not git_dir.stat.exists
  tags: setup

- name: Pull latest changes
  become_user: "{{ app_user }}"
  ansible.builtin.git:
    repo: "{{ repo_url }}"
    dest: "{{ app_dir }}"
    version: "{{ repo_branch }}"
    update: true
    force: true
  register: git_result
  when: git_dir.stat.exists
  tags: setup

- name: Check if venv exists
  ansible.builtin.stat:
    path: "{{ app_dir }}/.venv"
  register: venv_dir
  tags: setup

- name: Install Python dependencies
  become_user: "{{ app_user }}"
  ansible.builtin.shell: |
    {{ app_dir }}/.local/bin/uv sync --frozen
  args:
    chdir: "{{ app_dir }}"
  when: not venv_dir.stat.exists or git_result.changed
  tags: setup

- name: Generate application secret key if absent
  become_user: "{{ app_user }}"
  ansible.builtin.shell: |
    umask 077
    openssl rand -base64 48 > "{{ app_dir }}/.secret_key"
  args:
    creates: "{{ app_dir }}/.secret_key"
  tags: config

- name: Read application secret key
  ansible.builtin.slurp:
    src: "{{ app_dir }}/.secret_key"
  register: secret_key_file
  tags: config

- name: Set secret_key from generated file
  ansible.builtin.set_fact:
    secret_key: "{{ secret_key_file.content | b64decode | trim }}"
  tags: config

- name: Create .env file
  ansible.builtin.template:
    src: env.j2
    dest: "{{ app_dir }}/.env"
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    mode: "0600"
  notify: Restart metaseed-hub
  tags: config

- name: Run database migrations
  become_user: "{{ app_user }}"
  ansible.builtin.shell: |
    {{ app_dir }}/.venv/bin/alembic upgrade head
  args:
    chdir: "{{ app_dir }}"
  when: not venv_dir.stat.exists or git_result.changed
  tags: setup

- name: Install deploy script
  ansible.builtin.template:
    src: deploy.sh.j2
    dest: "{{ app_dir }}/deploy.sh"
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    mode: "0755"
  tags: setup

- name: Install systemd service
  ansible.builtin.template:
    src: metaseed-hub.service.j2
    dest: /etc/systemd/system/metaseed-hub.service
    mode: "0644"
  notify:
    - Reload systemd
    - Restart metaseed-hub
  tags: setup

- name: Install deploy service
  ansible.builtin.template:
    src: metaseed-deploy.service.j2
    dest: /etc/systemd/system/metaseed-deploy.service
    mode: "0644"
  notify: Reload systemd
  tags: setup

- name: Install deploy timer
  ansible.builtin.template:
    src: metaseed-deploy.timer.j2
    dest: /etc/systemd/system/metaseed-deploy.timer
    mode: "0644"
  notify: Reload systemd
  tags: setup

# Tagged `backup` as well as `setup` so the backup schedule can be installed or
# adjusted on its own, without the full setup run's apt, git, and migration
# steps restarting a healthy deployment.
- name: Create backup directory
  ansible.builtin.file:
    path: "{{ backup_dir }}"
    state: directory
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    # Dumps contain every dataset in the hub, so they are not world-readable.
    mode: "0700"
  tags: [setup, backup]

- name: Install backup service
  ansible.builtin.template:
    src: metaseed-backup.service.j2
    dest: /etc/systemd/system/metaseed-backup.service
    mode: "0644"
  notify: Reload systemd
  tags: [setup, backup]

- name: Install backup timer
  ansible.builtin.template:
    src: metaseed-backup.timer.j2
    dest: /etc/systemd/system/metaseed-backup.timer
    mode: "0644"
  notify: Reload systemd
  tags: [setup, backup]

- name: Enable and start the backup timer
  ansible.builtin.systemd:
    name: metaseed-backup.timer
    enabled: true
    state: started
    daemon_reload: true
  tags: [setup, backup]

# Tagged `containers` as well as `setup` so image pins can be applied on their
# own. Without this timer a merged pin changes nothing on the host: deploy.sh
# handles the application only and never invokes Docker, which is how PostgreSQL
# sat on an unpatched minor for months. See docs/container-updates.md.
- name: Install container update script
  ansible.builtin.template:
    src: update-containers.sh.j2
    dest: /opt/metaseed-docker/update-containers.sh
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    mode: "0755"
  tags: [setup, containers]

- name: Install container update service
  ansible.builtin.template:
    src: metaseed-containers.service.j2
    dest: /etc/systemd/system/metaseed-containers.service
    mode: "0644"
  notify: Reload systemd
  tags: [setup, containers]

- name: Install container update timer
  ansible.builtin.template:
    src: metaseed-containers.timer.j2
    dest: /etc/systemd/system/metaseed-containers.timer
    mode: "0644"
  notify: Reload systemd
  tags: [setup, containers]

- name: Enable and start the container update timer
  ansible.builtin.systemd:
    name: metaseed-containers.timer
    enabled: true
    state: started
    daemon_reload: true
  tags: [setup, containers]

- name: Configure sudoers for deploy
  ansible.builtin.copy:
    content: |
      # Allow app user to manage the service for deployments
      {{ app_user }} ALL=(ALL) NOPASSWD: /bin/systemctl reload metaseed-hub
      {{ app_user }} ALL=(ALL) NOPASSWD: /bin/systemctl restart metaseed-hub
      {{ app_user }} ALL=(ALL) NOPASSWD: /bin/systemctl status metaseed-hub *
      {{ app_user }} ALL=(ALL) NOPASSWD: /bin/journalctl -u metaseed-hub *
    dest: /etc/sudoers.d/metaseed-deploy
    mode: "0440"
    validate: "visudo -cf %s"
  tags: setup

- name: Enable and start services
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: true
    state: started
    daemon_reload: true
  loop:
    - metaseed-hub
    - metaseed-deploy.timer
    - metaseed-backup.timer
  tags: setup

- name: Install nginx configuration
  ansible.builtin.template:
    src: nginx.conf.j2
    dest: /etc/nginx/sites-available/metaseed-hub
    mode: "0644"
  notify: Reload nginx
  tags: nginx

- name: Enable nginx site
  ansible.builtin.file:
    src: /etc/nginx/sites-available/metaseed-hub
    dest: /etc/nginx/sites-enabled/metaseed-hub
    state: link
  notify: Reload nginx
  tags: nginx
