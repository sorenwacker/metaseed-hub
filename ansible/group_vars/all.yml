# Metaseed Hub deployment configuration

app_name: metaseed-hub
app_user: app
app_group: app
app_dir: /app
repo_url: https://github.com/sorenwacker/metaseed-hub.git
repo_branch: main

# Python/uv settings
python_version: "3.13"
uv_version: "latest"

# Service settings
app_port: 8080
app_workers: 2

# Database
db_name: metaseed_hub
db_user: metaseed
db_host: localhost
db_port: 5432

# Redis
# Matomo analytics (self-hosted, same-origin at matomo_url). matomo_site_id is
# empty until the first-run install creates a site; set it then to render the
# tracker. matomo_db_password lives in the vaulted secrets file.
matomo_port: 8081
matomo_url: "/matomo/"
matomo_site_id: ""
redis_host: localhost
redis_port: 6379

# Database backups (see docs/backups.md). Tiers overlap: a dump is deleted only
# when it falls outside all of them.
backup_dir: /var/backups/metaseed-hub
backup_schedule: "*-*-* 02:30:00"
backup_keep_last: 3
backup_keep_daily: 7
backup_keep_weekly: 4
backup_keep_monthly: 6

# OIDC (SURF SRAM)
oidc_url: https://proxy.sram.surf.nl
oidc_realm: ""
oidc_client_id: APP-CC24314E-7800-4E8F-8E8D-C8730A89B0BF
# eduperson_entitlement releases SRAM group memberships (admin access);
# offline_access is required for SRAM to return a refresh token.
oidc_scope: "openid email profile eduperson_entitlement offline_access"

# Application URL
app_url: https://metaseed.ewi.tudelft.nl

# Admin role (SRAM entitlement)
admin_role: "urn:mace:surf.nl:sram:group:tudelft:metaseed:admin"

# Nginx
nginx_server_name: metaseed.ewi.tudelft.nl
ssl_certificate: /etc/letsencrypt/live/metaseed.ewi.tudelft.nl/fullchain.pem
ssl_certificate_key: /etc/letsencrypt/live/metaseed.ewi.tudelft.nl/privkey.pem
